[workspace]
authors = ["Alex-Lewandowski <aflewandowski@alaska.edu>"]
channels = ["conda-forge"]
name = "ASF_SAR_Community_Cookbook"
platforms = ["linux-64", "osx-64", "osx-arm64"]
version = "0.1.0"

[dependencies]
jupyterlab = ">=4.6.4,<5"
jupyterlab-myst = ">=2.7.0,<3"
ipykernel = ">=7.4.0,<8"
ipyfilechooser = ">=0.6.0,<0.7"
mystmd = ">=1.10.1,<2"
pip = ">=26.2.1,<27"
asf_search = ">=14.0.3,<15"
earthaccess = ">=0.19.0,<0.20"
ipympl = ">=0.10.0,<0.11"

[pypi-dependencies]
jb-toc = ">=2.0.1, <3"

[tasks]
register-kernel = "python -m ipykernel install --user --name ASF_SAR_Community_Cookbook --display-name 'ASF_SAR_Community_Cookbook'"
lab = { cmd = "jupyter lab", depends-on = ["register-kernel"] }
